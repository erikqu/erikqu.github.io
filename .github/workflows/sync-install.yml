name: Sync install.sh

# Daily repair check for the event-driven publisher in workbench-cli. Run it
# manually if /install ever needs to be reconciled with the canonical script.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sync-installer-fallback
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest install.sh
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/erikqu/workbench-cli/main/install.sh \
            -o install

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install
          if git diff --cached --quiet; then
            echo "install is already up to date."
          else
            git commit -m "Sync install.sh from workbench-cli"
            git push
          fi
